[package]
name = "dxn_dtcg"
description = "Runtime for DTCG 2025.10 design-token documents: resolution, resolvers, aliases and typed projection."
readme = "../../README.md"
keywords = ["dtcg", "design-tokens", "tokens", "theme", "figma"]
categories = ["parser-implementations", "gui"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The vendored official corpus is test-only data; keep the published crate small.
exclude = ["tests/fixtures/dtcg-test-suite/**"]

[features]
diagnostics = []
# JavaScript and TypeScript expressions as computed token values
# (`$extensions["dxn.dtcg.expressions"]`), evaluated with QuickJS. Off by
# default: it compiles C, and resolution only evaluates expressions when
# `RuntimeOptions::with_expressions` turns them on.
expressions = ["dep:rquickjs", "dep:oxc"]

[dependencies]
dxn_dtcg_derive.workspace = true
oxc = { workspace = true, optional = true }
rquickjs = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
dxn_dtcg = { path = ".", features = ["diagnostics"] }
oxc.workspace = true
serde.workspace = true
serde_json.workspace = true
# Every test also runs on wasm32 under Node through `wasm-bindgen-test`.
wasm-bindgen-test.workspace = true

# Compile-fail cases need a native compiler.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
trybuild.workspace = true

# Tests read their fixtures through Node's `fs` on wasm32.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen.workspace = true

