[workspace]
resolver = "2"
members = ["crates/dxn_dtcg", "crates/dxn_dtcg_derive"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dXnSix/dXn.Dtcg"
homepage = "https://github.com/dXnSix/dXn.Dtcg"

[workspace.dependencies]
dxn_dtcg = { path = "crates/dxn_dtcg", version = "1.2.0" }
dxn_dtcg_derive = { path = "crates/dxn_dtcg_derive", version = "1.2.0" }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
syn = { version = "2.0", features = ["full"] }
thiserror = "2.0.17"
trybuild = "1.0"

