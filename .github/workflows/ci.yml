name: dXn.Dtcg

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    name: fmt, clippy, test, package
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: cargo package --workspace

  wasm-expressions:
    name: expressions on wasm32
    runs-on: ubuntu-latest
    env:
      # QuickJS compiles for wasm32 with an LLVM clang and llvm-ar.
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Install the wasm-bindgen test runner
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: cargo check -p dxn_dtcg --features expressions --target wasm32-unknown-unknown
      - run: cargo test -p dxn_dtcg --features expressions --target wasm32-unknown-unknown --test expressions_wasm
